<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory Rebirth Calculator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-8 font-sans min-h-screen">
    <div id="root" class="max-w-5xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const statLabels = ['str', 'dex', 'int', 'luk', 'watk', 'matk'];

        // ---------------------------------------------------------------------
        // ITEM DATABASE 
        // Add your server's custom items here. The dropdown will automatically 
        // populate, and selecting one will load its stats and slots.
        // ---------------------------------------------------------------------
        const itemDatabase = [
            { id: 'Lilin', name: 'Lilin Ring', stats: { str: 3, dex: 3, int: 3, luk: 3, watk: 3, matk: 3 }, slots: 5 },
            { id: 'UmbraH', name: 'Umbra Hat', stats: { str: 100, dex: 100, int: 100, luk: 100, watk: 40, matk: 40 }, slots: 12 },
            { id: 'BlackBelt', name: 'Tinkerer Black Belt', stats: { str: 22, dex: 22, int: 22, luk: 22, watk: 0, matk: 0 }, slots: 3 },
            { id: 'scg', name: 'Stormcaster Gloves', stats: { str: 0, dex: 0, int: 0, luk: 0, watk: 5, matk: 0 }, slots: 5 },
            { id: 'cra_top', name: 'CRA Top (Eagle Eye)', stats: { str: 40, dex: 40, int: 40, luk: 40, watk: 2, matk: 2 }, slots: 7 }
        ];

        function HeaderRow() {
            return (
                <div className="flex items-center space-x-1 sm:space-x-2 mb-2">
                    <div className="w-36"></div>
                    {statLabels.map(stat => (
                        <div key={stat} className="flex-1 text-center text-xs font-bold text-slate-400 uppercase">
                            {stat}
                        </div>
                    ))}
                </div>
            );
        }

        function StatRow({ label, values, onChange, readOnly, isHighlight, isSuccess }) {
            let bgClass = 'bg-slate-800 border-slate-600 focus:border-blue-500';
            let textClass = '';
            
            if (readOnly) {
                if (isHighlight) {
                    bgClass = 'bg-blue-900/40 border-blue-700/50 cursor-not-allowed';
                    textClass = 'text-blue-300 font-bold';
                } else if (isSuccess) {
                    bgClass = 'bg-emerald-900/40 border-emerald-700/50 cursor-not-allowed';
                    textClass = 'text-emerald-300 font-bold';
                } else {
                    bgClass = 'opacity-80 bg-slate-800/50 border-slate-700 cursor-not-allowed';
                    textClass = 'text-slate-300 font-semibold';
                }
            }

            return (
                <div className="flex items-center space-x-1 sm:space-x-2 mb-2">
                    <div className="w-36 text-xs sm:text-sm font-semibold text-slate-400 whitespace-nowrap overflow-hidden text-ellipsis pr-2" title={label}>
                        {label}
                    </div>
                    {statLabels.map(stat => (
                        <div key={stat} className="flex-1 flex flex-col items-center">
                            <span className="text-[10px] text-slate-500 uppercase mb-1 sm:hidden">{stat}</span>
                            <input
                                type="number"
                                className={`w-full border rounded px-1 sm:px-2 py-1.5 text-xs sm:text-sm text-center focus:outline-none transition-colors ${bgClass} ${textClass}`}
                                value={values[stat] === 0 && !readOnly ? '' : (readOnly ? Math.floor(values[stat]) : values[stat])}
                                placeholder={readOnly ? '0' : stat.toUpperCase()}
                                onChange={(e) => !readOnly && onChange(stat, e.target.value)}
                                readOnly={readOnly}
                            />
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const initBaseStats = () => ({ str: 3, dex: 3, int: 3, luk: 3, watk: 3, matk: 3 });
            const initZeroStats = () => ({ str: 0, dex: 0, int: 0, luk: 0, watk: 0, matk: 0 });

            // Application State
            const [baseStats, setBaseStats] = useState(initBaseStats());
            const [selectedItem, setSelectedItem] = useState('custom');
            const [settings, setSettings] = useState({ 
                slots: 5, 
                type: 'cog', 
                scrollAvg: 10, 
                multiplier: 1.5,
                carryoverPct: 30
            });
            
            // Rebirth State
            const [rebirths, setRebirths] = useState(Array(5).fill(null).map(() => ({
                foodType: 'levelX'
            })));

            // Handlers
            const handleBaseChange = (stat, value) => {
                setBaseStats(prev => ({ ...prev, [stat]: value === '' ? '' : Number(value) }));
                setSelectedItem('custom'); // Switch to custom if manually edited
            };

            const handleDatabaseSelect = (e) => {
                const itemId = e.target.value;
                setSelectedItem(itemId);
                
                const item = itemDatabase.find(i => i.id === itemId);
                if (item) {
                    setBaseStats({ ...item.stats });
                    setSettings(prev => ({ ...prev, slots: item.slots }));
                }
            };

            const handleFoodTypeChange = (index, value) => {
                const newRebirths = [...rebirths];
                newRebirths[index] = { ...newRebirths[index], foodType: value };
                setRebirths(newRebirths);
            };

            // Calculation Engine
            const results = useMemo(() => {
                let res = [];
                let carryOver = initZeroStats(); 

                // Clamp scroll average to valid ranges for the chosen scroll type
                const scrollTypeMax = settings.type === 'cog' ? 5 : 20;
                const scrollTypeMin = settings.type === 'cog' ? 0 : -5;
                const scrollVal = Math.max(scrollTypeMin, Math.min(scrollTypeMax, Number(settings.scrollAvg) || 0));

                const mult = Number(settings.multiplier) || 1.0;
                const clampedMult = Math.min(1.5, Math.max(1.0, mult));
                
                const carryPct = (Number(settings.carryoverPct) || 0) / 100;

                for (let i = 0; i < 5; i++) {
                    const rb = rebirths[i];
                    
                    const foodStats = rb.foodType === 'levelX' 
                        ? { str: 45, dex: 45, int: 45, luk: 45, watk: 0, matk: 0 }
                        : initZeroStats(); 

                    let start = initZeroStats();
                    let scrolls = initZeroStats();
                    let preUpgrade = initZeroStats();
                    let end = initZeroStats();
                    let carry = initZeroStats();
                    let currentCarryOver = { ...carryOver };

                    statLabels.forEach(s => {
                        // 1. Total Starting Stats = Base Stats (re-added every rebirth) + Carryover from previous
                        start[s] = Number(baseStats[s] || 0) + currentCarryOver[s];

                        // 2. Additions (Food + Scrolls)
                        scrolls[s] = Math.floor(Number(settings.slots || 0) * scrollVal);
                        preUpgrade[s] = start[s] + foodStats[s] + scrolls[s];

                        // 3. Upgrades (Compound multiplication 4 times, flooring each time as Maplestory does)
                        let currentStat = preUpgrade[s];
                        for (let step = 0; step < 4; step++) {
                            currentStat = Math.floor(currentStat * clampedMult);
                        }
                        end[s] = currentStat;

                        // 4. Calculate custom % retained for next rebirth
                        carry[s] = Math.floor(end[s] * carryPct);
                    });

                    res.push({ currentCarryOver, start, foodStats, scrolls, preUpgrade, end, carry });
                    carryOver = carry;
                }

                return res;
            }, [baseStats, settings, rebirths]);

            return (
                <div>
                    <h1 className="text-3xl font-black mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                        Maplestory Rebirth Calculator
                    </h1>
                    <p className="text-center text-slate-400 mb-8">Calculates compounding multipliers and dynamic iteration carryover.</p>

                    {/* Final Output Hero */}
                    <div className="mb-8 bg-gradient-to-b from-emerald-900/40 to-slate-900 border border-emerald-700/50 p-6 sm:p-8 rounded-2xl text-center shadow-2xl relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiMzNGQzOTkiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-50"></div>
                        <div className="relative z-10">
                            <h2 className="text-2xl sm:text-3xl font-black mb-6 text-emerald-400">Final Item Stats (End of Rebirth 5)</h2>
                            <div className="flex justify-center">
                                <div className="w-full max-w-3xl bg-slate-900/80 p-4 rounded-xl border border-emerald-900/50 shadow-[0_0_30px_rgba(16,185,129,0.15)]">
                                    <HeaderRow />
                                    <StatRow label="FINAL ITEM" values={results[4].end} readOnly={true} isSuccess={true} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Global Settings Panel */}
                    <div className="bg-slate-800 p-4 sm:p-6 rounded-xl shadow-xl mb-8 border border-slate-700">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-emerald-400 border-b border-slate-700 pb-2">Clean Base Item Stats</h3>
                                
                                {/* Database Load Dropdown */}
                                <div className="flex items-center space-x-4 mb-6 bg-slate-900 p-3 rounded-lg border border-slate-700">
                                    <label className="w-36 text-sm font-bold text-slate-300">Load from Database:</label>
                                    <select
                                        className="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none font-semibold text-emerald-300"
                                        value={selectedItem}
                                        onChange={handleDatabaseSelect}
                                    >
                                        {itemDatabase.map(item => (
                                            <option key={item.id} value={item.id}>{item.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <HeaderRow />
                                <StatRow label="Clean Base Stats" values={baseStats} onChange={handleBaseChange} />
                            </div>
                            
                            <div>
                                <h3 className="text-lg font-bold mb-4 text-emerald-400 border-b border-slate-700 pb-2">Global Settings (Applied every Rebirth)</h3>
                                <div className="space-y-4">
                                    <div className="flex items-center space-x-4">
                                        <label className="w-48 text-sm font-semibold text-slate-400">Carryover Percentage (%)</label>
                                        <input
                                            type="number"
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
                                            value={settings.carryoverPct}
                                            step="1"
                                            min="0"
                                            max="100"
                                            onChange={(e) => setSettings({...settings, carryoverPct: e.target.value === '' ? '' : Number(e.target.value)})}
                                        />
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <label className="w-48 text-sm font-semibold text-slate-400" title="Applied 4 times consecutively to the item's total stats">Upgrade Multiplier</label>
                                        <input
                                            type="number"
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
                                            value={settings.multiplier}
                                            step="0.05"
                                            min="1.0"
                                            max="1.5"
                                            onChange={(e) => setSettings({...settings, multiplier: e.target.value === '' ? '' : Number(e.target.value)})}
                                        />
                                    </div>
                                    <div className="flex items-center space-x-4 mt-4 pt-4 border-t border-slate-700">
                                        <label className="w-48 text-sm font-semibold text-slate-400">Scroll Type</label>
                                        <select
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
                                            value={settings.type}
                                            onChange={(e) => setSettings({...settings, type: e.target.value})}
                                        >
                                            <option value="cog">COG (0 to 5)</option>
                                            <option value="mcog">MCOG (-5 to +20)</option>
                                        </select>
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <label className="w-48 text-sm font-semibold text-slate-400">Scroll Slots per Rebirth</label>
                                        <input
                                            type="number"
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none text-emerald-300 font-bold"
                                            value={settings.slots === 0 ? '' : settings.slots}
                                            placeholder="Number of slots"
                                            onChange={(e) => {
                                                setSettings({...settings, slots: e.target.value === '' ? 0 : Number(e.target.value)});
                                                setSelectedItem('custom'); // Editing slots manually triggers custom state
                                            }}
                                            min="0"
                                        />
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <label className="w-48 text-sm font-semibold text-slate-400" title="Expected average stat gain per scroll">Avg Stats per Scroll</label>
                                        <input
                                            type="number"
                                            className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none"
                                            value={settings.scrollAvg}
                                            step="0.1"
                                            onChange={(e) => setSettings({...settings, scrollAvg: e.target.value === '' ? '' : Number(e.target.value)})}
                                        />
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1 pl-52">
                                        Max bounds auto-enforced: {settings.type === 'cog' ? '0 to 5' : '-5 to 20'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Rebirth Panels */}
                    <div className="space-y-6">
                        {rebirths.map((rb, index) => (
                            <div key={index} className="bg-slate-800/80 p-4 sm:p-6 rounded-xl shadow-lg border border-slate-700">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-blue-400">Rebirth Iteration {index + 1}</h3>
                                    
                                    <div className="flex items-center space-x-2">
                                        <label className="text-sm font-semibold text-slate-400">Food (3 Slots):</label>
                                        <select 
                                            className="bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none text-slate-200"
                                            value={rb.foodType}
                                            onChange={(e) => handleFoodTypeChange(index, e.target.value)}
                                        >
                                            <option value="none">None (0 Stats)</option>
                                            <option value="levelX">Level X (+45 Stats)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Left Column: Startup and Additions */}
                                    <div>
                                        <div className="mb-4 p-3 bg-slate-900/80 rounded-lg border border-slate-800">
                                            <h4 className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">1. Starting Stats</h4>
                                            <HeaderRow />
                                            <StatRow label="Clean Base Stats" values={baseStats} readOnly={true} />
                                            <StatRow label={`+ ${settings.carryoverPct}% from Prev`} values={results[index].currentCarryOver} readOnly={true} />
                                            <div className="my-2 border-b border-slate-700/50"></div>
                                            <StatRow label="= Total Start" values={results[index].start} readOnly={true} isHighlight={true} />
                                        </div>

                                        <div className="p-3 bg-slate-900/80 rounded-lg border border-slate-800">
                                            <h4 className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">2. Additions</h4>
                                            <HeaderRow />
                                            <StatRow label="Food Stats" values={results[index].foodStats} readOnly={true} />
                                            <StatRow label={`Scrolls (${settings.slots})`} values={results[index].scrolls} readOnly={true} />
                                            <div className="my-2 border-b border-slate-700/50"></div>
                                            <StatRow label="= Pre-Upgrade Total" values={results[index].preUpgrade} readOnly={true} isHighlight={true} />
                                        </div>
                                    </div>

                                    {/* Right Column: Upgrades and Final */}
                                    <div className="flex flex-col">
                                        <div className="flex-1 p-4 bg-emerald-900/20 border border-emerald-800/50 rounded-lg flex flex-col justify-center">
                                            <h4 className="text-sm font-bold text-emerald-400 mb-2">3. After 4x Upgrades ({settings.multiplier}x Multiplier)</h4>
                                            <p className="text-xs text-slate-400 mb-4">The Pre-Upgrade Total is multiplied by {settings.multiplier} four times consecutively.</p>
                                            <HeaderRow />
                                            <StatRow label={`Final R${index + 1} Stats`} values={results[index].end} readOnly={true} isSuccess={true} />
                                            
                                            <div className="mt-4 pt-3 border-t border-emerald-900/50 text-xs text-emerald-300/80 flex flex-col sm:flex-row items-center justify-between gap-2">
                                                <span>➔ {settings.carryoverPct}% saved for Rebirth {index + 2 > 5 ? 'End' : index + 2}</span>
                                                <span className="font-mono bg-slate-900/80 px-2 py-1 rounded w-full sm:w-auto text-center overflow-hidden text-ellipsis">
                                                    {statLabels.map(s => `+${results[index].carry[s]}`).join(' | ')}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
